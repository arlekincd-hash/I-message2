<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Платформа презентаций</title>
    
    <!-- Шрифты Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Иконки Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Тема (настройки цветов, шрифтов) -->
    <link rel="stylesheet" href="config/theme.css">
    
    <!-- Стили движка (НЕ ТРОГАТЬ автору материала) -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cards.css">
</head>
<body>

    <!-- Шапка (Header) -->
    <header class="header">
        <div id="header-course-title" class="header-course-title">Название курса</div>
        <div id="header-author" class="header-author">Автор</div>
    </header>

    <!-- Контейнер презентации (Сцена) -->
    <main id="presentation-container">
        <!-- Слайды генерируются через JS -->
    </main>

    <!-- Подвал (Footer) -->
    <footer class="footer">
        <div class="footer-progress-container">
            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
        </div>
        <a id="footer-contacts" class="footer-contacts" href="#" target="_blank" rel="noopener noreferrer">Контакты</a>
    </footer>

    <!-- Кнопка Назад -->
    <button id="prev-btn" class="nav-button" disabled>
        <i data-lucide="chevron-left"></i> <span id="prev-btn-text">Назад</span>
    </button>

    <!-- Кнопка Далее -->
    <button id="next-btn" class="nav-button" disabled>
        <span id="next-btn-text">Далее</span> <i data-lucide="chevron-right"></i>
    </button>

    <!-- Финальный экран -->
    <div id="final-screen" class="final-screen hidden">
        <div class="final-content">
            <h1 class="final-title">Курс завершен!</h1>
            <p class="final-result" id="final-result"></p>
            <button id="restart-btn" class="restart-button">
                <i data-lucide="refresh-cw"></i> <span id="restart-btn-text">Пройти заново</span>
            </button>
        </div>
    </div>

    <!-- КОНФИГУРАЦИЯ (можно менять настройки курса) -->
    <script src="config/config.js"></script>
    
    <!-- КОНТЕНТ (можно менять слайды, тексты, вопросы) -->
    <script src="content/content.js"></script>
    
    <!-- ДВИЖОК (НЕ ТРОГАТЬ автору материала) -->
    <script src="js/utils.js"></script>
    <script src="js/reveal.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Инициализация иконок Lucide -->
    <script>
        // Перерисовка иконок после загрузки всех скриптов
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => lucide.createIcons(), 100);
        });
    </script>
</body>
</html>
