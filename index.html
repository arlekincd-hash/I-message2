<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я-сообщения</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Иконки -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Верхняя панель -->
    <header class="top-bar">
        <div class="course-title">Я-сообщения</div>
        <div class="author">Сафронов Денис</div>
    </header>

    <!-- Контейнер презентации -->
    <main id="presentation-container">
        <!-- Слайды генерируются через JS -->
    </main>

    <!-- Нижняя панель -->
    <footer class="bottom-bar">
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>
        <a href="https://telegram.me/SDM_ryazan" class="contacts" target="_blank" rel="noopener noreferrer">Разработчик: Сафронов Денис</a>
    </footer>

    <!-- Кнопка Назад -->
    <button id="prev-btn" class="prev-button" disabled>
        <i data-lucide="arrow-up"></i> Назад
    </button>

    <!-- Кнопка Далее -->
    <button id="next-btn" class="next-button" disabled>
        Далее <i data-lucide="arrow-down"></i>
    </button>

    <!-- Финальный экран -->
    <div id="final-screen" class="final-screen hidden">
        <div class="final-content">
            <h1 class="final-title">Курс завершен!</h1>
            <p class="final-result" id="final-result"></p>
            <button id="restart-btn" class="restart-button">
                Пройти заново <i data-lucide="refresh-cw"></i>
            </button>
        </div>
    </div>

    <!-- Скрипт -->
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
