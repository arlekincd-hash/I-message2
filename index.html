<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-Message: Искусство диалога</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Иконки -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Верхняя панель -->
    <header class="top-bar">
        <div class="course-title">I-Message: Искусство диалога</div>
        <div class="author">Автор: Александр Арлекин</div>
    </header>

    <!-- Контейнер презентации -->
    <main id="presentation-container">
        <!-- Слайды генерируются через JS -->
    </main>

    <!-- Нижняя панель -->
    <footer class="bottom-bar">
        <div class="progress-container">
            <div class="progress-label">Прогресс</div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </div>
        <div class="contacts">Разработчик: contact@example.com</div>
    </footer>

    <!-- Кнопка Далее -->
    <button id="next-btn" class="next-button">
        Далее <i data-lucide="arrow-down"></i>
    </button>

    <!-- Скрипт -->
    <script src="script.js"></script>
    <script>
        // Инициализация иконок после загрузки страницы
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
